name: Actualitzador EPG STARZ en Temps Real

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instal·lar Dependències de Python
        run: pip install -r requirements.txt

      - name: Instal·lar Navegador Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: Executar Scraper Dinàmic
        run: python scraper.py

      - name: Guardar canvis a GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add epg.xml
          git diff-index --quiet HEAD || (git commit -m "Auto-update STARZ EPG [skip ci]" && git push)
